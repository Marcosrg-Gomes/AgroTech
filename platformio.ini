; AgroTech — Estufa Inteligente (ESP32 + Wokwi + ThingSpeak)
[env:esp32dev]
platform = espressif32@6.5.0        ; Arduino core 2.0.14 (o código também compila no core 3.x)
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
